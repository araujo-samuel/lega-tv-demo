<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LÊGA TV – Painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!--
WIREFRAME (desktop)
+----------+--------------------------------------------------------+
| [L] LÊGA | Título da página            [ busca.............] (ML) |
|          +--------------------------------------------------------+
| Visão    | Visão geral : faixa "No ar agora" (TVs ao vivo)        |
| Telas    |               gráfico de exibições | alertas           |
| Mídias   | Telas       : chips de filtro, grade de cartões        |
| Program. | Tela        : cena (parede + TV grande) | linha do tempo|
| Relat.   | Mídias      : área de envio, mosaico de fotos          |
|          | Programação : lista com alças | TV de pré-visualização |
|          | Relatórios  : período, barras, tabela                  |
+----------+--------------------------------------------------------+
Celular: barra superior curta, busca abaixo, navegação fixa embaixo.

PLANO DE DESIGN
Assunto: mídia indoor; quem opera é o dono da rede de telas em lojas.
Formas do tema: TV com moldura e base, foto do anúncio, lista de reprodução como linha do tempo.
Cores: azul-marinho (estrutura), laranja LÊGA (ação e dados), verde-água (estado ao vivo), neutros frios.
Fontes: Bricolage Grotesque (títulos e números), Public Sans (texto).
Escala: 12 / 14 / 16 / 20 / 28 px.
-->
<style>
:root{
  --navy:#0e1b33;--navy-2:#18294a;--navy-line:#26385c;
  --orange:#ff5a1f;--orange-ink:#b93a0a;--orange-soft:#fff0e9;
  --teal:#0e9f8e;--teal-ink:#0b6b5f;
  --bg:#f3f5f9;--surface:#fff;--line:#e3e7ef;--line-2:#cfd6e3;
  --text:#121a2b;--muted:#566178;
  --ok:#0b6b4f;--ok-bg:#dff4ea;--bad:#b42318;--bad-bg:#fde7e4;--warn:#8a5300;--warn-bg:#fdf0d2;
  --f-head:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(14,27,51,.06),0 4px 14px rgba(14,27,51,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--f-body)}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head);font-weight:600;line-height:1.2;letter-spacing:-.01em}
h1{font-size:1.25rem}h2{font-size:1.25rem}h3{font-size:1rem}
a{color:var(--orange-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #1d6fd6;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--muted)}.small{font-size:.875rem}

/* estrutura */
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.side{background:var(--navy);color:#c5cee0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 24px;color:#fff;font:700 1.125rem var(--f-head);letter-spacing:.01em;text-decoration:none}
.brand svg{width:34px;height:34px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:8px;color:#c5cee0;text-decoration:none;font-weight:500;font-size:.9375rem}
.side nav a:hover{background:var(--navy-2);color:#fff}
.side nav a[aria-current="page"]{background:var(--navy-2);color:#fff}
.side nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--orange)}
.side nav a[aria-current="page"] .ic{color:var(--orange)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--navy-line);font-size:.8125rem;color:#9fb0cf}
.col{min-width:0}
.top{display:flex;align-items:center;gap:16px;padding:14px 32px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top svg.mb{display:none}
.top h1{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{position:relative;width:min(320px,35vw)}
.search .ic{position:absolute;left:12px;top:12px;color:var(--muted);width:18px;height:18px}
.search input{width:100%;min-height:44px;padding:0 12px 0 38px;border:1px solid var(--line-2);border-radius:10px;background:var(--bg)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 .875rem var(--f-head);flex:none}
main{padding:28px 32px 64px;max-width:1280px}
.bar-h{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.bar-h p{color:var(--muted)}
@media(max-width:899px){
  .app{display:block}
  .side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;padding:0;z-index:20;border-top:1px solid var(--navy-line)}
  .side .brand,.side-foot{display:none}
  .side nav{flex-direction:row;width:100%;gap:0}
  .side nav a{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:60px;padding:6px 0;border-radius:0;font-size:.625rem}
  .side nav a[aria-current="page"]::before{left:20%;right:20%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .top{flex-wrap:wrap;padding:10px 16px;gap:10px}
  .top svg.mb{display:block;width:32px;height:32px}
  .search{order:5;width:100%}
  main{padding:20px 16px 96px}
}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px 0}
.card-b{padding:16px 20px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:.9375rem;transition:background .15s,transform .1s}
.btn:hover{background:var(--bg)}.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.btn.pri:hover{background:#ff7a47}
.btn.ico{width:44px;padding:0}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.off{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
label{display:block;font-size:.875rem;font-weight:600;margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line-2);border-radius:10px;background:#fff}
.field{margin-bottom:14px}
.msg{padding:12px 14px;border-radius:10px;font-size:.9375rem;margin-top:10px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.bad{background:var(--bad-bg);color:var(--bad)}.msg.warn{background:var(--warn-bg);color:var(--warn)}
.ms{display:none}@media(max-width:760px){.hm{display:none}.ms{display:block;font-size:.8125rem;color:var(--muted)}}
.m.sus .im::after{content:"";position:absolute;inset:0;background:rgba(243,245,249,.6)}.m .bd{z-index:1}.m .bd.w{top:8px;bottom:auto;background:var(--warn-bg);color:var(--warn)}
.rows li.sus .ph,.rows li.sus .grip,.rows li.sus .acts{opacity:.5}.rows li.sus b{color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:44px;padding:0 4px;border:0;background:none;cursor:pointer;font-weight:600;font-size:.875rem;white-space:nowrap}
.sw i{position:relative;flex:none;width:44px;height:26px;border-radius:13px;background:var(--line-2);transition:background .2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"] i{background:var(--teal-ink)}.sw[aria-checked="true"] i::after{transform:translateX(18px)}
@media(max-width:760px){.sw{flex-direction:column;gap:2px;font-size:.6875rem}.pw .pill{white-space:normal}}
.fl a{font-weight:600}
.fgrid{display:grid;gap:20px}@media(min-width:1000px){.fgrid{grid-template-columns:1.4fr 1fr;align-items:start}}
.empty{padding:28px 20px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:opacity .25s,transform .25s;z-index:50;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:899px){.toast{bottom:84px}}

/* TV */
.tv{position:relative;background:#0a0e16;border-radius:10px;padding:8px;box-shadow:inset 0 0 0 1px #2b3446,0 18px 30px -12px rgba(14,27,51,.45)}
.tv .screen{position:relative;overflow:hidden;background:#05070b;aspect-ratio:16/9;container-type:inline-size;border-radius:2px}
.tv.v .screen{aspect-ratio:9/16}
.tv .screen::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.05);clip-path:polygon(0 0,38% 0,14% 100%,0 100%);pointer-events:none}
.tv.big{padding:12px;border-radius:14px}
.stand{width:22%;height:16px;margin:0 auto;background:#1b2231;clip-path:polygon(15% 0,85% 0,100% 100%,0 100%)}
.stand-base{width:36%;height:6px;margin:0 auto;background:#2b3446;border-radius:3px}
.ad{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.ad.on{opacity:1}
.ad .ph{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1)}
.ad.vid.on .ph{transform:scale(1.07);transition:transform 30s linear}
.ad .cap{position:absolute;left:4%;bottom:6%;max-width:78%;background:rgba(14,27,51,.9);color:#fff;padding:2.5cqw 3.5cqw;border-radius:2px}
.ad .cap b{display:block;font:600 clamp(.6rem,4.2cqw,1.6rem)/1.15 var(--f-head)}
.ad .cap span{display:block;margin-top:.4em;font-size:clamp(.5rem,2.4cqw,.95rem);color:#c5cee0}
.tv.v .ad .cap{left:0;right:0;bottom:0;max-width:none;padding:5cqw}
.tv.v .ad .cap b{font-size:clamp(.6rem,7cqw,1.4rem)}
.tv.v .ad .cap span{font-size:clamp(.5rem,4.2cqw,.9rem)}
.tv.mini{padding:4px;border-radius:6px;box-shadow:inset 0 0 0 1px #2b3446}
.tv.mini .cap{padding:2cqw 3cqw}
.noise{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8794ab;font-size:.8125rem;padding:10px}
.scene{position:relative;border-radius:16px;overflow:hidden;background:#dfe5ef;padding:36px 24px 0;min-height:360px}
.scene::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:#c3ccdb;border-top:1px solid #b2bccd}
.scene .tvbox{position:relative;z-index:1;margin:0 auto 11%;width:min(100%,640px)}
.scene .tvbox.v{width:min(70%,250px)}
.scene .tvbox .stand,.scene .tvbox .stand-base{position:relative}
.scene .tvbox .shadow{position:absolute;left:10%;right:10%;bottom:-12px;height:14px;background:rgba(14,27,51,.22);filter:blur(8px);border-radius:50%}
.scene .tvbox.v .stand,.scene .tvbox.v .stand-base{display:none}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;width:0;background:var(--orange)}
.pinfo{font-size:.875rem;color:var(--muted);padding-top:8px;min-height:2em}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{min-height:44px;padding:0 16px;border:0;background:#fff;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* visão geral */
.live{display:flex;gap:16px;overflow-x:auto;padding:16px 20px 20px;scroll-snap-type:x proximity}
.tile{flex:0 0 210px;scroll-snap-align:start;text-decoration:none;color:inherit}
.tile b{display:block;margin-top:10px;font-size:.9375rem}
.tile span{font-size:.8125rem;color:var(--muted)}
.ov{display:grid;gap:20px;margin-top:20px}
@media(min-width:1000px){.ov{grid-template-columns:1.7fr 1fr}}
.kpis{display:flex;gap:28px;flex-wrap:wrap}
.kpis b{font:600 1.75rem/1.1 var(--f-head);display:block}
.kpis span{font-size:.875rem;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;margin-top:12px}
.chart text{font:12px var(--f-body);fill:#566178}
.chart .v{fill:var(--text);font-weight:600}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 20px;border-top:1px solid var(--line)}
.alert .ic{color:var(--bad);margin-top:2px}
.alert div{flex:1;min-width:0}
.alert .btn{min-height:44px}

/* telas */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px}
.grp{display:flex;align-items:baseline;gap:12px;margin:28px 0 14px}
.grp span{color:var(--muted);font-size:.875rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sc{display:block;text-decoration:none;color:inherit;padding:12px;overflow:hidden}
.sc:hover{border-color:var(--line-2)}
.sc .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-top:12px}
.sc .t b{display:block;font-family:var(--f-head);font-size:1rem}
.sc .now{margin-top:8px;font-size:.875rem}
.sc .sy{margin-top:4px;font-size:.8125rem;color:var(--muted)}
.sc.wide{grid-column:span 2;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center}
.sc.wide .t{margin-top:0;flex-direction:column}
.sc.out{display:flex;gap:12px;align-items:center;background:#fbf3f2;border-color:#f3cfca}
.sc.out .dark{flex:0 0 96px;height:60px;border-radius:6px;background:#0a0e16;display:grid;place-items:center;color:#5d6a82;font-size:.75rem}
.sc.out .t{margin-top:0;flex:1;flex-direction:column}
@media(max-width:640px){.sc.wide{grid-column:auto;display:block}.sc.wide .t{margin-top:12px}}
.detail{display:grid;gap:20px}
@media(min-width:1000px){.detail{grid-template-columns:1.5fr 1fr}}
.tl{list-style:none;margin:0;padding:0 20px 8px;position:relative}
.tl li{position:relative;display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0 10px 28px;align-items:center}
.tl li::before{content:"";position:absolute;left:6px;top:0;bottom:0;border-left:2px solid var(--line)}
.tl li:first-child::before{top:50%}.tl li:last-child::before{bottom:50%}
.tl li::after{content:"";position:absolute;left:0;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:2px solid var(--line-2)}
.tl li.cur::after{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.tl .ph{width:72px;height:48px;border-radius:6px;background-size:cover;background-position:center}
.tl b{display:block;font-size:.9375rem;line-height:1.3}
.tl small{color:var(--muted);font-size:.8125rem}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 18px;padding:16px 20px}
dt{color:var(--muted);font-size:.9375rem}dd{margin:0}

/* mídias */
.drop{border:2px dashed var(--line-2);border-radius:12px;background:#fff;padding:22px;display:grid;gap:16px;transition:border-color .15s,background .15s}
@media(min-width:760px){.drop{grid-template-columns:1fr 280px;align-items:center}}
.drop.over{border-color:var(--orange);background:var(--orange-soft)}
.drop .ic.big{width:32px;height:32px;color:var(--orange-ink)}
.drop h2{font-size:1.0625rem;margin:6px 0 2px}
.mos{column-gap:16px;columns:4 200px;margin-top:20px}
.m{break-inside:avoid;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.m .im{position:relative;background-size:cover;background-position:center}
.m .bd{position:absolute;left:8px;bottom:8px;background:rgba(14,27,51,.9);color:#fff;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:4px}
.m .tx{padding:10px 12px 12px}
.m b{display:block;font-family:var(--f-head);font-size:.9375rem;line-height:1.25}
.m span{font-size:.8125rem;color:var(--muted)}

/* programação */
.pg{display:grid;gap:20px}
@media(min-width:1000px){.pg{grid-template-columns:1.3fr 1fr;align-items:start}.pg .sticky{position:sticky;top:96px}}
.rows{list-style:none;margin:0;padding:8px 12px}
.rows li{display:grid;grid-template-columns:28px 88px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:10px;border:1px solid transparent;background:#fff}
.rows li+li{margin-top:4px}
.rows li:hover{background:var(--bg)}
.rows li.drag{opacity:.4}.rows li.ovr{border-color:var(--orange)}
.rows li.moved{animation:flash .8s}
@keyframes flash{from{background:var(--orange-soft)}to{background:#fff}}
.grip{cursor:grab;color:var(--muted);display:grid;place-items:center;min-height:44px;touch-action:none}
.rows .ph{width:88px;height:56px;border-radius:6px;background-size:cover;background-position:center}
.rows b{display:block;font-size:.9375rem;line-height:1.3}
.rows .d{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:.8125rem;color:var(--muted);white-space:nowrap}
.rows .d input{width:76px;min-height:44px}
.rows .acts{display:flex;gap:4px}
@media(max-width:700px){.rows li{grid-template-columns:28px 72px 1fr}.rows .ph{width:72px;height:48px}.rows .acts{grid-column:1/-1;justify-content:flex-end}}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:0 20px 20px}
.pk{border:1px solid var(--line);border-radius:10px;padding:0;background:#fff;cursor:pointer;text-align:left;overflow:hidden}
.pk:hover{border-color:var(--orange)}
.pk .ph{aspect-ratio:4/3;background-size:cover;background-position:center}
.pk span{display:block;padding:6px 8px;font-size:.8125rem;line-height:1.3}
.savebar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}

/* relatórios */
.hb{display:grid;grid-template-columns:minmax(120px,240px) 1fr 64px;gap:12px;align-items:center;min-height:36px}
.hb .tr{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--orange);border-radius:7px;transition:width .5s}
.hb .n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.hb .l{font-size:.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.hb{grid-template-columns:1fr 56px}.hb .tr{grid-column:1/-1;order:3}.hb{row-gap:2px;margin-bottom:8px}}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:.875rem;font-weight:600;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 20px;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;background:var(--bg)}
.tw{overflow-x:auto}
@media(max-width:560px){.tbl th,.tbl td{padding:10px 12px}.hs{display:none}.ms{display:block;font-size:.8125rem;color:var(--muted)}}

dialog{border:0;border-radius:14px;padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 20px 50px rgba(14,27,51,.35)}
dialog::backdrop{background:rgba(14,27,51,.55)}
.dlg{padding:22px}.dlg h2{margin-bottom:16px}
.code{font:600 2rem/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;background:var(--bg);border:1px dashed var(--line-2);border-radius:10px;padding:14px;text-align:center;margin:12px 0}

<script>
(function(){
"use strict";
var MEDIA=[
 {id:"m1",img:"padaria1",title:"Pão quentinho toda hora",adv:"Padaria Pão Quente",type:"imagem",dur:8,week:640},

 {id:"m7",img:"mercado",title:"Frutas e verduras fresquinhas",adv:"Mercadinho Fresco do Dia",type:"imagem",dur:8,week:590},
 {id:"m8",img:"restaurante",title:"Almoço executivo todo dia",adv:"Restaurante Sabor da Casa",type:"vídeo",dur:30,week:300},
 {id:"m9",img:"farmacia",title:"Cuidado de todo dia",adv:"Farmácia Bem Estar",type:"imagem",dur:8,week:505},

];
var SCREENS=[
 {id:"t1",city:"Campinas",est:"Salão Estilo Livre",name:"Recepção",on:true,sync:"há 2 min",w:5},
 {id:"t2",city:"Campinas",est:"Salão Estilo Livre",name:"Sala de espera",on:true,sync:"há 4 min",w:4},
 {id:"t3",city:"Campinas",est:"Lanchonete Ponto Certo",name:"Balcão",on:false,sync:"há 3 h",w:2},
 {id:"t4",city:"Campinas",est:"Lava Rápido Brilho",name:"Sala de espera",on:true,sync:"há 1 min",w:5},
 {id:"t5",city:"Ribeirão Preto",est:"Barbearia Navalha",name:"Entrada",on:true,sync:"há 3 min",w:4},
 {id:"t6",city:"Ribeirão Preto",est:"Barbearia Navalha",name:"Espera",on:true,sync:"há 2 min",w:3},
 {id:"t7",city:"Ribeirão Preto",est:"Lavanderia Clean Express",name:"Balcão",on:false,sync:"há 1 dia",w:1},
 {id:"t8",city:"Ribeirão Preto",est:"Lavanderia Clean Express",name:"Vitrine",on:true,sync:"há 6 min",w:3}
];
var PROGS={"g:Campinas":{m1:8,m3:8,m2:15,m5:20,m7:8,m9:8},"g:Ribeirão Preto":{m4:8,m6:8,m8:30,m10:8,m12:25}};
var ORDER={"g:Campinas":["m1","m3","m2","m5","m7","m9"],"g:Ribeirão Preto":["m4","m6","m8","m10","m12"]};
var PERIODS={hoje:{label:"Hoje",f:.14},"7":{label:"7 dias",f:1},"30":{label:"30 dias",f:4.3}};
var DAYS=["qua 14","qui 15","sex 16","sáb 17","dom 18","seg 19","ter 20"],DW=[.14,.15,.16,.17,.12,.12,.14];

var M={};MEDIA.forEach(function(m){M[m.id]=m});
var CL=[];
[["Padaria Pão Quente",10,10,"12/03/2025","08/10",0],["Clínica Sorriso Pleno",6,22,"05/05/2025",null,0],["Ótica Visão Nova",4,15,"20/01/2026",null,0],
 ["Academia Força Total",8,5,"14/02/2025",null,1,"11/09"],["Auto Center Mecânica Rápida",5,12,"02/09/2025",null,0],["Mercadinho Fresco do Dia",3,28,"18/06/2026",null,0],
 ["Restaurante Sabor da Casa",8,3,"09/11/2025","03/10",0],["Farmácia Bem Estar",6,18,"25/07/2025",null,0],["Pet Shop Amigo Fiel",2,25,"30/04/2026",null,0],
 ["Móveis Casa Bella",4,1,"11/12/2025","01/10",0],["Café Grão Dourado",5,7,"07/08/2025","07/10",0]].forEach(function(d,i){
  var p=function(n){return (n<10?"0":"")+n},h=[["Julho",7],["Agosto",8],["Setembro",9]].map(function(x){return{m:x[0]+" de 2026",paid:p(d[2])+"/"+p(x[1])}});
  if(d[6]){h[2].paid=d[6];h[2].late=true}
  h.push({m:"Outubro de 2026",paid:d[4]});
  CL.push({id:"c"+(i+1),name:d[0],telas:d[1],due:d[2],start:d[3],susp:!!d[5],hist:h});
});
function cli(id){return CL.filter(function(c){return c.id===id})[0]}
function cliBy(name){return CL.filter(function(c){return c.name===name})[0]}
function isSusp(m){var c=cliBy(m.adv);return !!(c&&c.susp)}
function pad2(n){return (n<10?"0":"")+n}
function brl(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function valor(c){return c.telas*20}
function cur_(c){return c.hist[c.hist.length-1]}
function lateDays(c){return !cur_(c).paid&&c.due<20?20-c.due:0}
function soon(c){return !cur_(c).paid&&c.due>=20&&c.due-20<=5}
function pstat(c){return c.susp?"susp":lateDays(c)?"late":soon(c)?"soon":"ok"}
function nextDue(c){return pad2(c.due)+"/"+(cur_(c).paid?"11":"10")+"/2026"}
function payPill(c){var k=pstat(c);return k==="susp"?'<span class="pill off">Suspenso</span>':k==="late"?'<span class="pill off">Atrasado há '+lateDays(c)+(lateDays(c)===1?' dia':' dias')+'</span>':k==="soon"?'<span class="pill warn">Vence em breve</span>':'<span class="pill ok">Em dia</span>'}
function adsPill(c){return c.susp?'<span class="pill warn">Suspensos</span>':'<span class="pill ok">No ar</span>'}
function affected(c){
  var ids={};MEDIA.forEach(function(m){if(m.adv===c.name)ids[m.id]=1});var mm={},tt=0;
  SCREENS.forEach(function(s){var hit=false;(ORDER[progKey(s)]||[]).forEach(function(i){if(ids[i]){hit=true;mm[i]=1}});if(hit)tt++});
  return{m:Object.keys(mm).length,t:tt};
}
function sumVal(f){return CL.filter(f).reduce(function(a,c){return a+valor(c)},0)}
function scr(id){return SCREENS.filter(function(s){return s.id===id})[0]}
function progKey(s){return ORDER[s.id]?s.id:"g:"+s.city}
function items(key,all){return (ORDER[key]||[]).filter(function(id){return all||!isSusp(M[id])}).map(function(id){var m=M[id];return{m:m,dur:m.type==="vídeo"?m.dur:((PROGS[key]||{})[id]||m.dur)}})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function img(m){return m.src||("img/"+m.img+".jpg")}
function bg(m){return "background-image:url('"+img(m)+"')"}
function fmt(n){return n.toLocaleString("pt-BR")}
function ic(n){return '<svg class="ic" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function pill(on){return on?'<span class="pill ok">Ligada</span>':'<span class="pill off">Desligada</span>'}
function onAir(){var s={};Object.keys(ORDER).forEach(function(k){ORDER[k].forEach(function(i){if(!isSusp(M[i]))s[i]=1})});return Object.keys(s).length}
function weekTotal(){return MEDIA.reduce(function(a,m){return a+m.week},0)}
function startIdx(s,len){return len?s.w%len:0}
function nowText(s){
  if(!s.on)return "Sem sinal";
  var it=items(progKey(s));if(!it.length)return "Sem programação";
  var c=it[startIdx(s,it.length)];return esc(c.m.title)+", "+esc(c.m.adv);
}
function loopText(it){var t=it.reduce(function(a,i){return a+i.dur},0);return Math.floor(t/60)+" min "+(t%60)+" s"}

/* ---------- player ---------- */
var players=[];
function stopAll(){players.forEach(function(p){clearTimeout(p.t);clearInterval(p.i);p.dead=true});players=[]}
function mkPlayer(o){
  var p={idx:o.start-1,dead:false};players.push(p);
  var screen=o.screen;
  function step(){
    if(p.dead)return;
    var it=o.getItems();
    if(!it.length){screen.innerHTML='<div class="noise">Sem mídias na programação.</div>';p.t=setTimeout(step,2500);return}
    p.idx=(p.idx+1+it.length)%it.length;var cur=it[p.idx];
    var el=document.createElement("div");el.className="ad"+(cur.m.type==="vídeo"?" vid":"");
    el.innerHTML='<div class="ph" style="'+bg(cur.m)+'"></div><div class="cap"><b>'+esc(cur.m.title)+'</b><span>'+esc(cur.m.adv)+'</span></div>';
    var old=[].slice.call(screen.querySelectorAll(".ad,.noise"));
    screen.appendChild(el);
    void el.offsetWidth;setTimeout(function(){el.classList.add("on")},30);
    setTimeout(function(){old.forEach(function(x){x.remove()})},700);
    var total=cur.dur*1000,t0=Date.now();
    if(o.onChange)o.onChange(p.idx,cur,it);
    clearInterval(p.i);
    if(o.bar)p.i=setInterval(function(){
      var e=Date.now()-t0;o.bar.style.width=Math.min(100,e/total*100)+"%";
      if(o.info)o.info.textContent="Item "+(p.idx+1)+" de "+it.length+": "+cur.m.title+" ("+Math.max(0,Math.ceil((total-e)/1000))+" s)";
    },250);
    p.t=setTimeout(step,total);
  }
  step();
}
function tvMarkup(cls,vertical){return '<div class="tv '+(cls||"")+(vertical?" v":"")+'"><div class="screen"></div></div>'}
function liveMini(root,s){
  var sc=root.querySelector(".screen");
  var now=root.parentNode.querySelector('[data-now="'+s.id+'"]')||root.querySelector('[data-now="'+s.id+'"]');
  var key=progKey(s);
  mkPlayer({screen:sc,getItems:function(){return items(key)},start:startIdx(s,items(key).length),onChange:function(i,c){var n=document.querySelector('[data-now="'+s.id+'"]');if(n)n.innerHTML=esc(c.m.title)+", "+esc(c.m.adv)}});
}

/* ---------- estado ---------- */
var main=document.getElementById("main");
var state={fmsg:null,ff:"todos",orient:false,progTarget:null,draft:null,saved:false,picker:false,rep:{view:"midia",per:"7"},tf:"todas",mf:"todas",q:"",adv:"",up:[],drag:-1,moved:-1};
var TITLES={"visao-geral":"Visão geral",telas:"Telas",midias:"Mídias",programacao:"Programação",faturamento:"Faturamento",relatorios:"Relatórios"};

function head(sub,extra){return '<div class="bar-h"><p>'+sub+'</p>'+(extra||'')+'</div>'}
function match(txt){return !state.q||txt.toLowerCase().indexOf(state.q.toLowerCase())>=0}

/* gráfico */
var chartJob=null;
function drawBars(el,data,labels){
  var w=Math.max(280,el.clientWidth),h=w<480?220:260,pl=38,pb=28,pt=24;
  var max=Math.max.apply(null,data),step=max>1200?400:200;var top=Math.ceil(max/step)*step;
  var bw=(w-pl-8)/data.length,s='<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Exibições por dia nos últimos 7 dias">';
  for(var v=0;v<=top;v+=step){var y=pt+(h-pt-pb)*(1-v/top);s+='<line x1="'+pl+'" x2="'+w+'" y1="'+y+'" y2="'+y+'" stroke="#e3e7ef"/><text x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(v)+'</text>'}
  data.forEach(function(d,i){var bh=(h-pt-pb)*d/top,x=pl+i*bw+bw*.2,ww=bw*.6,y=h-pb-bh;
    s+='<path d="M'+x+' '+(h-pb)+'V'+(y+4)+'Q'+x+' '+y+' '+(x+4)+' '+y+'H'+(x+ww-4)+'Q'+(x+ww)+' '+y+' '+(x+ww)+' '+(y+4)+'V'+(h-pb)+'Z" fill="#ff5a1f"/>';
    s+='<text class="v" x="'+(x+ww/2)+'" y="'+(y-6)+'" text-anchor="middle">'+fmt(d)+'</text><text x="'+(x+ww/2)+'" y="'+(h-8)+'" text-anchor="middle">'+labels[i]+'</text>'});
  el.innerHTML=s+'</svg>';
}
function dayData(){var t=weekTotal(),a=0,r=DW.map(function(f,i){if(i===DW.length-1)return 0;var n=Math.round(t*f);a+=n;return n});r[r.length-1]=t-a;return r}

/* ---------- páginas ---------- */
function pVisao(){
  var nsus=CL.filter(function(c){return c.susp}).length,on=SCREENS.filter(function(s){return s.on}),off=SCREENS.filter(function(s){return !s.on});
  var h='<section class="card"><div class="card-h"><div><h2>No ar agora</h2><p class="muted small">'+on.length+' de '+SCREENS.length+' telas ligadas</p></div><a class="btn" href="#/telas">Ver todas as telas</a></div><div class="live">';
  on.forEach(function(s){h+='<a class="tile" href="#/telas/'+s.id+'" data-live="'+s.id+'">'+tvMarkup("mini")+'<b>'+esc(s.est)+'</b><span>'+esc(s.name)+', '+esc(s.city)+'</span></a>'});
  h+='</div></section><div class="ov"><section class="card chart"><div class="card-h"><div><h2>Exibições por dia</h2><p class="muted small">Últimos 7 dias, todas as telas</p></div><div class="kpis"><div><b>'+fmt(weekTotal())+'</b><span>exibições</span></div><div><b>'+onAir()+'</b><span>mídias no ar</span></div></div></div><div class="card-b" id="chart"></div></section>';
  h+='<section class="card"><div class="card-h" style="padding-bottom:14px"><div><h2>Alertas</h2><p class="muted small">'+(off.length+(nsus?1:0)?(off.length+(nsus?1:0))+' avisos pedem atenção':'Nada pendente')+'</p></div></div>';
  if(!off.length&&!nsus)h+='<p class="empty">Todas as telas estão ligadas e nenhum cliente está suspenso.</p>';
  if(nsus)h+='<div class="alert">'+ic("alert")+'<div><b>'+nsus+(nsus===1?' cliente com anúncios suspensos':' clientes com anúncios suspensos')+'</b><div class="small muted">As mídias deles não aparecem nas telas. Confira o pagamento e reative quando regularizar.</div></div><a class="btn" href="#/faturamento">Ver faturamento</a></div>';
  off.forEach(function(s){h+='<div class="alert">'+ic("alert")+'<div><b>'+esc(s.est)+', '+esc(s.name)+'</b><div class="small muted">Sem sinal. Última sincronização '+s.sync+'. Confira a energia e a internet do local.</div></div><a class="btn" href="#/telas/'+s.id+'">Ver tela</a></div>'});
  return h+'</section></div>';
}

function chip(group,val,label,cur){return '<button class="chip" data-a="'+group+'" data-v="'+val+'" aria-pressed="'+(cur===val)+'">'+label+'</button>'}
function pTelas(){
  var cities=[];SCREENS.forEach(function(s){if(cities.indexOf(s.city)<0)cities.push(s.city)});
  var h=head("Acompanhe o que cada tela está exibindo.",'<button class="btn pri" data-a="cadastrar">'+ic("plus")+'Cadastrar tela</button>');
  h+='<div class="chips" role="group" aria-label="Filtrar telas">'+chip("tf","todas","Todas",state.tf)+chip("tf","on","Ligadas",state.tf)+chip("tf","off","Desligadas",state.tf)+cities.map(function(c){return chip("tf","c:"+c,esc(c),state.tf)}).join("")+'</div>';
  var any=false;
  cities.forEach(function(c){
    var list=SCREENS.filter(function(s){
      if(s.city!==c)return false;
      if(state.tf==="on"&&!s.on)return false;if(state.tf==="off"&&s.on)return false;
      if(state.tf.indexOf("c:")===0&&state.tf.slice(2)!==c)return false;
      return match(s.est+" "+s.name+" "+s.city)});
    if(!list.length)return;any=true;
    h+='<div class="grp"><h2>'+esc(c)+'</h2><span>'+list.length+(list.length===1?' tela':' telas')+'</span></div><div class="grid">';
    var firstOn=true;
    list.forEach(function(s){
      if(!s.on){h+='<a class="card sc out" href="#/telas/'+s.id+'"><div class="dark">Sem sinal</div><div class="t"><div><b>'+esc(s.est)+'</b><span class="small muted">'+esc(s.name)+'</span></div>'+pill(false)+'<div class="sy">Última sincronização '+s.sync+'</div></div></a>';return}
      var wide=firstOn&&list.length>2;firstOn=false;
      h+='<a class="card sc'+(wide?" wide":"")+'" href="#/telas/'+s.id+'" data-live="'+s.id+'">'+tvMarkup("mini")+'<div><div class="t"><div><b>'+esc(s.est)+'</b><span class="small muted">'+esc(s.name)+'</span></div>'+pill(true)+'</div><div class="now" data-now="'+s.id+'">'+nowText(s)+'</div><div class="sy">Sincronizou '+s.sync+'</div></div></a>';
    });
    h+='</div>';
  });
  if(!any)h+='<p class="empty">Nenhuma tela encontrada. Limpe a busca ou escolha outro filtro.</p>';
  return h;
}

function pTela(id){
  var s=scr(id);if(!s)return '<p class="empty">Tela não encontrada. <a href="#/telas">Voltar para Telas</a></p>';

function checkFile(name,dur,adv,src){
  var r;

    if(["jpg","jpeg","png","mp4"].indexOf(ext)<0)r={ok:false,t:name+": formato não aceito. Envie JPG, PNG ou MP4."};
    else if(ext==="mp4"&&dur>30)r={ok:false,t:name+": vídeo recusado. Ele tem "+Math.round(dur)+" s e o limite é 30 s. Corte o vídeo e envie de novo."};
    else{

      var m={id:"m"+(MEDIA.length+1),img:["mercado","moveis","pet"][MEDIA.length%3],src:vid?null:src,title:base,adv:adv.trim(),type:vid?"vídeo":"imagem",dur:vid?Math.round(dur):8,week:0};
      MEDIA.unshift(m);M[m.id]=m;r={ok:true,t:name+": enviado para a biblioteca."};
    }

function handleFiles(files){
  var adv=(document.getElementById("upAdv")||{}).value||"";state.adv=adv;
  [].forEach.call(files,function(f){
    var ext=(f.name.split(".").pop()||"").toLowerCase();
    if(ext==="mp4"){
      var url=URL.createObjectURL(f),v=document.createElement("video");v.preload="metadata";
      v.onloadedmetadata=function(){var d=v.duration;URL.revokeObjectURL(url);checkFile(f.name,d,adv)};
      v.onerror=function(){URL.revokeObjectURL(url);state.up.unshift({ok:false,t:f.name+": não foi possível ler o vídeo. Verifique o arquivo."});render()};
      v.src=url;

}

  if(a==="per"){state.rep.per=t.dataset.v;render();return}
  if(a==="ff"){state.ff=t.dataset.v;render();return}
  if(a==="pay"){var c=cli(t.dataset.id),x=cur_(c);
    if(x.paid){state.fmsg={k:"bad",t:"O pagamento de outubro de 2026 já foi registrado em "+x.paid+". Não é possível registrar o mesmo mês duas vezes."};render();return}
    x.late=lateDays(c)>0;x.paid="20/10";state.fmsg={k:"ok",t:"Pagamento de outubro registrado em 20/10. Próximo vencimento em "+nextDue(c)+"."};render();
    if(c.susp)openDlgHtml('<div class="dlg"><h2 id="dlgT">Reativar anúncios?</h2><p>O pagamento de '+esc(c.name)+' foi registrado. Reativar agora faz as mídias voltarem às telas na próxima sincronização.</p><div class="acts-end"><button class="btn" data-a="fechar">Agora não</button><button class="btn pri" data-a="react" data-id="'+c.id+'">Reativar anúncios</button></div></div>');
    else toast("Pagamento registrado.");return}
  if(a==="tog"){var ct=cli(t.dataset.id);if(ct.susp){ct.susp=false;render();toast("Anúncios de "+ct.name+" reativados. Voltam às telas na próxima sincronização.");var sb=document.querySelector('[data-a="tog"][data-id="'+ct.id+'"]');if(sb)sb.focus();return}
    t.dataset.a="asksusp"}
  if(a==="asksusp"||t.dataset.a==="asksusp"){var c2=cli(t.dataset.id),f=affected(c2);
    var eff=f.m?'<strong>'+f.m+(f.m===1?' mídia deixa':' mídias deixam')+' de ser exibida'+(f.m===1?'':'s')+' em '+f.t+(f.t===1?' tela':' telas')+'</strong> na próxima sincronização.':'Nenhuma mídia deste cliente está no ar hoje, então as telas não mudam.';
    openDlgHtml('<div class="dlg"><h2 id="dlgT">Desativar anúncios de '+esc(c2.name)+'?</h2><p>'+eff+' O cliente continua cadastrado e você pode reativar os anúncios quando quiser.</p><div class="acts-end"><button class="btn" data-a="fechar">Cancelar</button><button class="btn pri" data-a="dosusp" data-id="'+c2.id+'">Desativar anúncios</button></div></div>');return}
  if(a==="dosusp"){var c3=cli(t.dataset.id);c3.susp=true;state.fmsg=null;document.getElementById("dlg").close();render();toast("Anúncios desativados. Saem das telas na próxima sincronização.");return}
  if(a==="react"){var c4=cli(t.dataset.id);c4.susp=false;state.fmsg=null;var d4=document.getElementById("dlg");if(d4.open)d4.close();render();toast("Anúncios reativados. Voltam às telas na próxima sincronização.");return}
  if(a==="tf"){state.tf=t.dataset.v;render();return}
  if(a==="mf"){state.mf=t.dataset.v;render();return}
  if(a==="cadastrar")return openPair();
  if(a==="fechar"){document.getElementById("dlg").close();return}
  if(a==="up"||a==="down"){var j=a==="up"?i-1:i+1,d=state.draft,x=d[i];d[i]=d[j];d[j]=x;state.saved=false;state.moved=j;render();var b=document.querySelector('[data-a="'+a+'"][data-i="'+j+'"]');if(b&&!b.disabled)b.focus();else{var o=document.querySelector('[data-a="'+(a==="up"?"down":"up")+'"][data-i="'+j+'"]');if(o&&!o.disabled)o.focus()}return}
  if(a==="rm"){state.draft.splice(i,1);render();return}
  if(a==="picker"){state.picker=!state.picker;render();return}
  if(a==="add"){var v=t.dataset.id;state.draft.push({id:v,dur:M[v].type==="vídeo"?M[v].dur:8});state.moved=state.draft.length-1;render();return}
  if(a==="save"){var key=state.progTarget;ORDER[key]=state.draft.map(function(d){return d.id});PROGS[key]={};state.draft.forEach(function(d){PROGS[key][d.id]=d.dur});render();toast("Programação salva. A pré-visualização foi atualizada.");return}
  if(a==="pair")return pairNext();
  if(a==="pairdone")return pairDone();
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="pt")location.hash="#/programacao/"+encodeURIComponent(t.value);
  if(t.id==="upFile"){handleFiles(t.files);t.value=""}
  if(t.type==="number"&&t.dataset.i!==undefined){var v=Math.max(3,Math.min(60,parseInt(t.value,10)||8));state.draft[+t.dataset.i].dur=v;t.value=v}
});
document.getElementById("q").addEventListener("input",function(e){state.q=e.target.value;if(cur.k==="telas"&&!cur.p[1]||cur.k==="midias"||cur.k==="faturamento"&&!cur.p[1])render()});
document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter"&&cur.k!=="telas"&&cur.k!=="midias"&&cur.k!=="faturamento")location.hash="#/telas"});
/* arrastar e soltar */
document.addEventListener("mousedown",function(e){var g=e.target.closest("[data-grip]");if(g)g.closest("li").draggable=true});
document.addEventListener("dragstart",function(e){var li=e.target.closest&&e.target.closest("#rows li");if(!li)return;state.drag=+li.dataset.i;li.classList.add("drag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain","x")}catch(x){}});
document.addEventListener("dragover",function(e){var li=e.target.closest&&e.target.closest("#rows li");var dz=e.target.closest&&e.target.closest("#drop");
  if(li&&state.drag>=0){e.preventDefault();document.querySelectorAll("#rows li.ovr").forEach(function(x){x.classList.remove("ovr")});li.classList.add("ovr")}
  if(dz){e.preventDefault();dz.classList.add("over")}});
document.addEventListener("dragleave",function(e){var dz=document.getElementById("drop");if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove("over")});
document.addEventListener("dragend",function(){state.drag=-1;document.querySelectorAll("#rows li").forEach(function(x){x.classList.remove("drag","ovr");x.draggable=false})});
document.addEventListener("drop",function(e){
  var dz=e.target.closest&&e.target.closest("#drop");
  if(dz){e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);return}
  var li=e.target.closest&&e.target.closest("#rows li");
  if(li&&state.drag>=0){e.preventDefault();var to=+li.dataset.i,d=state.draft,m=d.splice(state.drag,1)[0];d.splice(to,0,m);state.drag=-1;state.moved=to;render()}
});
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("drop",function(e){e.preventDefault()});

/* cadastro de tela */
var pair={};
function openPair(){
  var d=document.getElementById("dlg");pair={};
  var cities=[];SCREENS.forEach(function(s){if(cities.indexOf(s.city)<0)cities.push(s.city)});
  d.innerHTML='<form class="dlg" onsubmit="return false"><h2 id="dlgT">Cadastrar tela</h2>'+
   '<div class="field"><label for="pc">Cidade</label><input type="text" id="pc" list="cl" autocomplete="off"><datalist id="cl">'+cities.map(function(c){return '<option value="'+esc(c)+'">'}).join("")+'</datalist></div>'+
   '<div class="field"><label for="pe">Estabelecimento</label><input type="text" id="pe" autocomplete="off"></div>'+
   '<div class="field"><label for="pn">Nome da tela</label><input type="text" id="pn" autocomplete="off" placeholder="Ex.: Recepção"></div>'+
   '<div id="pairOut" role="status" aria-live="polite"></div>'+
   '<div class="acts-end"><button type="button" class="btn" data-a="fechar">Cancelar</button><button type="button" class="btn pri" data-a="pair">Gerar código</button></div></form>';
  d.showModal();document.getElementById("pc").focus();
}
function pairNext(){
  var c=document.getElementById("pc").value.trim(),e=document.getElementById("pe").value.trim(),n=document.getElementById("pn").value.trim();
  if(!c||!e||!n){document.getElementById("pairOut").innerHTML='<div class="msg bad">Preencha cidade, estabelecimento e nome da tela.</div>';return}
  var A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=function(){return A[Math.floor(Math.random()*A.length)]};
  pair={c:c,e:e,n:n,code:r()+r()+r()+"-"+r()+r()+r()};
  document.getElementById("pairOut").innerHTML='<p>No Raspberry ligado à TV, abra o player e digite o código:</p><div class="code">'+pair.code+'</div><p class="small muted">A tela fica ligada na lista assim que o Raspberry se conectar.</p>';
  var b=document.querySelector('#dlg [data-a="pair"]');b.dataset.a="pairdone";b.textContent="Concluir";
}
function pairDone(){
  SCREENS.push({id:"t"+(SCREENS.length+1),city:pair.c,est:pair.e,name:pair.n,on:false,sync:"ainda não",w:2});
  document.getElementById("dlg").close();render();toast("Tela cadastrada. Aguardando o Raspberry.");
}
window.addEventListener("hashchange",function(){state.fmsg=null;render();window.scrollTo(0,0)});
var rz;window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){if(chartJob)chartJob()},150)});
render();
})();
</script>
</body>
</html>
